# pull[bot] promotes tested commits from `main` to `stable`.
# Forks: replace `castrojo` below with your own GitHub username.
version: "1"
rules:
  - base: stable
    upstream: main
    mergeMethod: hardreset
    mergeUnstable: false
    reviewers:
      - castrojo
    conflictReviewers:
      - castrojo
label: "promotion"
conflictLabel: "promotion-conflict"
