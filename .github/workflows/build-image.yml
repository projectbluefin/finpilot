---
name: Build and Push Image

# Two-branch model:
#   main   = testing branch, publishes :stable-testing (plus :testing for the
#            factory release gate)
#   stable = production branch, publishes :stable
# promote-main-to-stable.yml opens the main -> stable promotion PR.
#
# PR builds are disabled by default to save CI minutes. To enable them, add:
#   pull_request:
#     branches:
#       - main
#     paths-ignore:
#       - "**.md"
#       - ".github/workflows/*validate*.yml"
on:
  push:
    branches:
      - main
      - stable
    paths-ignore:
      - "**.md"
      - ".github/workflows/*validate*.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  IMAGE_REGISTRY: "ghcr.io/${{ github.repository_owner }}"
  IMAGE_DESC: "My Customized Universal Blue Image"
  IMAGE_KEYWORDS: "bootc,ublue,universal-blue"
  IMAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/120078124?s=200&v=4"
  DEFAULT_TAG: "stable"
  PRODUCTION_BRANCH: "stable" # The branch that publishes :stable production images
  REGISTRY_CACHE_WRITE: ${{ github.event_name != 'pull_request' && '1' || '0' }}
  ENABLE_RECHUNKING: "false"
  RECHUNK_MAX_LAYERS: "128"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Prepare environment
        run: |
          echo "IMAGE_REGISTRY=${IMAGE_REGISTRY,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"

      # Anything not on the production branch is a testing build. TAG_STREAM
      # keeps generate-tags on the "testing" stream so it never emits
      # stable-daily* aliases that would collide with production; the
      # Finalize branch tags step renames them to stable-testing-*.
      - name: Determine image tag
        id: determine-tag
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "${REF_NAME}" != "${PRODUCTION_BRANCH}" ]]; then
            echo "DEFAULT_TAG=${DEFAULT_TAG}-testing" >> "${GITHUB_ENV}"
            echo "TAG_STREAM=testing" >> "${GITHUB_ENV}"
            echo "Building testing image: ${DEFAULT_TAG}-testing"
          else
            echo "TAG_STREAM=${DEFAULT_TAG}" >> "${GITHUB_ENV}"
            echo "Building production image: ${DEFAULT_TAG}"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Preflight
        id: preflight
        uses: projectbluefin/actions/bootc-build/preflight@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          registry: ghcr.io
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ env.IMAGE_NAME }}

      - name: Setup runner
        uses: projectbluefin/actions/bootc-build/setup-runner@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        id: dnf-cache-restore
        uses: projectbluefin/actions/bootc-build/dnf-cache@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      - name: Detect changes
        id: detect-changes
        uses: projectbluefin/actions/bootc-build/detect-changes@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          filters: |
            image:
              - 'Containerfile'
              - 'build/**'
              - 'custom/**'
              - 'Justfile'

      - name: Build image
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: build-image
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_VENDOR: ${{ env.IMAGE_VENDOR }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
          REGISTRY_CACHE_WRITE: ${{ env.REGISTRY_CACHE_WRITE }}
        with:
          timeout_minutes: 120
          max_attempts: 3
          retry_wait_seconds: 300
          command: |
            sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Get version label
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: version
        shell: bash
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          DEFAULT_TAG: ${{ env.DEFAULT_TAG }}
        run: |
          VERSION_LABEL=$(sudo podman inspect "localhost/${IMAGE_NAME}:${DEFAULT_TAG}" \
            --format '{{index .Config.Labels "org.opencontainers.image.version"}}')
          echo "version=${VERSION_LABEL}" >> "${GITHUB_OUTPUT}"
          echo "Version: ${VERSION_LABEL}"

      - name: Generate tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: generate-tags
        uses: projectbluefin/actions/bootc-build/generate-tags@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          base-name: ${{ env.IMAGE_NAME }}
          stream-name: ${{ env.TAG_STREAM }}
          version-label: ${{ steps.version.outputs.version }}
          event-name: ${{ github.event_name }}
          pr-number: ${{ github.event.number }}

      # generate-tags emits stream-native tags (testing* or stable-daily* plus
      # version aliases). For testing builds this renames testing* tags to
      # stable-testing-*, keeps the bare :testing tag (the factory release
      # gate in reusable-promote-squash.yml resolves digests from it), and
      # guarantees the mutable consumer tag (:stable / :stable-testing) is
      # always published.
      - name: Finalize branch tags
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        id: branch-tags
        shell: bash
        env:
          GENERATED_TAGS: ${{ steps.generate-tags.outputs.tags }}
        run: |
          read -r -a generated_tags <<< "${GENERATED_TAGS}"
          branch_tags=()

          add_tag() {
            local candidate="$1"
            local existing
            for existing in "${branch_tags[@]}"; do
              [[ "${existing}" == "${candidate}" ]] && return
            done
            branch_tags+=("${candidate}")
          }

          for tag in "${generated_tags[@]}"; do
            if [[ "${TAG_STREAM}" == "testing" ]]; then
              # Bare :testing stays so the promotion release gate can resolve it.
              [[ "${tag}" == "testing" ]] && add_tag "${tag}"
              add_tag "${tag/testing/stable-testing}"
            else
              add_tag "${tag}"
            fi
          done
          add_tag "${DEFAULT_TAG}"

          echo "tags=${branch_tags[*]}" >> "${GITHUB_OUTPUT}"
          echo "default-tag=${DEFAULT_TAG}" >> "${GITHUB_OUTPUT}"

      - name: Save DNF cache
        if: always() && !cancelled() && github.event_name != 'pull_request'
        uses: projectbluefin/actions/bootc-build/dnf-cache@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          action: save
          cache-name: ${{ env.IMAGE_NAME }}
          allow-write: ${{ github.event_name != 'pull_request' && 'true' || 'false' }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # OPTIONAL: Set ENABLE_RECHUNKING to "true" above to optimize OTA deltas.
      # This uses OCI-native chunkah and does not require bootc-base-imagectl.
      - name: Rechunk image
        if: env.ENABLE_RECHUNKING == 'true' && github.event_name != 'pull_request'
        id: rechunk-image
        uses: projectbluefin/actions/bootc-build/chunka@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          source-image: localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}
          max-layers: ${{ env.RECHUNK_MAX_LAYERS }}

      - name: Tag images
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          ALIAS_TAGS: ${{ steps.branch-tags.outputs.tags }}
        run: |
          sudo -E "$(command -v just)" tag-images "${IMAGE_NAME}" \
                          "${DEFAULT_TAG}" \
                          "${ALIAS_TAGS}"

      # Publish from both the testing (main) and production (stable) branches;
      # PR builds only build and validate, they never publish.
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        if: github.event_name != 'pull_request'
        id: push
        uses: projectbluefin/actions/bootc-build/push-image@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          image-name: ${{ env.IMAGE_NAME }}
          tags: ${{ steps.branch-tags.outputs.tags }}
          default-tag: ${{ steps.branch-tags.outputs.default-tag }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Sign and attest (SLSA Build L2 provenance)
      # Bluefin pattern: keyless OIDC signing via Fulcio.
      # Requires 'id-token: write' permission (granted above).
      # Non-fatal — signing failures never block image publishing,
      # but unsigned images fail the promotion release gate.

      - name: Sign and publish
        if: github.event_name != 'pull_request'
        continue-on-error: true
        uses: projectbluefin/actions/bootc-build/sign-and-publish@9c699818ddf1043b8f5af8b862f59f783c6c7bda # v1
        with:
          image: ${{ env.IMAGE_REGISTRY }}/${{ env.IMAGE_NAME }}
          digest: ${{ steps.push.outputs.digest }}
          signing-mode: keyless
          generate-sbom: false
          push-attestation: true
          certificate-identity-regexp: https://github.com/${{ github.repository }}/.github/workflows/
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build telemetry summary
        if: steps.detect-changes.outputs.should_build == 'true' || github.event_name != 'pull_request'
        shell: bash
        run: |
          IMAGE_SIZE=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{.Size}}' 2>/dev/null || echo "0")
          IMAGE_SIZE_MB=$(( IMAGE_SIZE / 1024 / 1024 ))
          LAYER_COUNT=$(sudo podman image inspect "localhost/${{ env.IMAGE_NAME }}:${{ env.DEFAULT_TAG }}" \
            --format '{{len .RootFS.Layers}}' 2>/dev/null || echo "?")

          {
            echo "## Build Telemetry: ${{ env.IMAGE_NAME }}"
            echo ""
            echo "**Image size (uncompressed):** ${IMAGE_SIZE_MB} MB"
            echo "**Layer count:** ${LAYER_COUNT}"
          } >> "$GITHUB_STEP_SUMMARY"
