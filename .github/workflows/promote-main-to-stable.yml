---
name: Promote main to stable

# Two-branch model: `main` is the testing branch (publishes :stable-testing and
# :testing); `stable` is the production branch. The shared factory workflow
# opens (or refreshes) a squash promotion PR from `main` to `stable` daily, or
# when a maintainer dispatches it. Merging that PR triggers digest promotion in
# execute-release.yml; it does not rebuild `:stable`.
#
# Reusable logic lives in projectbluefin/actions — this is a thin caller,
# matching the pattern in projectbluefin/bluefin and projectbluefin/bluefin-lts.
# pull[bot] was considered and rejected: the factory reusable is auditable,
# org-maintained, and shared with the other image repos (see issues #235/#237).

on:
  schedule:
    # Default daily promotion window. Fork owners may change this cadence.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  # unblock-promotion-checks needs write to approve the check runs GitHub holds
  # for a bot-authored pull request. The reusable's jobs each declare their own
  # permissions, so widening the ceiling does not hand actions: write to them.
  actions: write
  contents: write
  issues: write
  packages: read
  pull-requests: write
  statuses: write

concurrency:
  group: promote-main-to-stable
  cancel-in-progress: false

jobs:
  promote:
    name: Promote main to stable
    uses: projectbluefin/actions/.github/workflows/reusable-promote-squash.yml@ab62f2774eb465d912b61b5c0cd9cd230c811768 # v1
    with:
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository }}/\.github/workflows/
      registry: ghcr.io/${{ github.repository_owner }}
      source_branch: main
      target_branch: stable
      # A personal image runs no e2e suites. The gate job below verifies the
      # current candidate's cosign signature before a human merges; the tree
      # guard in execute-release.yml is what binds the promotion to the commit
      # the PR was built from.
      run_e2e: false
      # The only path that auto-enrolls the PR is a merge queue, which needs an
      # organization-owned repository. Personal-account forks cannot use one.
      use_merge_queue: false
      # Enrolling without a merge queue runs `gh pr merge --auto` with no merge
      # method, and GitHub CLI refuses that without a TTY ("--merge, --rebase,
      # or --squash required when not running interactively"). The reusable
      # exposes no merge-method input, so enrollment stays off and the promotion
      # PR is merged by hand.
      #
      # Merging by hand matters beyond the merge method. A merge performed as
      # github-actions creates no workflow runs — a push made with that token is
      # exempt only for workflow_dispatch and repository_dispatch — so the
      # push-triggered execute-release.yml and sync-stable-to-main.yml never
      # fire for it and the release becomes a manual dispatch. A merge performed
      # by a person fires both, which is why this PR is merged in the UI rather
      # than by a bot.
      enqueue_promotion: false
      # Personal-account forks do not have an <owner>/maintainers team.
      # Organization forks can enable this and optionally set `reviewer`.
      request_reviewer: false
    secrets: inherit

  # The reusable rebuilds the promotion branch by overlaying main's tree on
  # stable, then staging the paths git reports as deletions. Git reports a moved
  # file as a rename, so every path main moved survives on its old path and the
  # branch's tree stops matching main's — which execute-release.yml's tree guard
  # then refuses after the merge. Repair it here, before a human merges the PR: a
  # commit carrying main's tree on top of stable, the shape the reusable intends.
  # Skipped when the tree already matches, so a correct branch never loses its
  # approvals to a no-op force-push.
  repair-promotion-branch:
    name: Make the promotion branch match main
    needs: [promote]
    if: needs.promote.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Rebuild the branch when its tree has drifted from main
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin "${PROMOTION_BRANCH}" main stable
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Repair the branch the reusable built. A missing branch means there
          # was nothing to promote, so there is nothing to repair.
          if ! git rev-parse --verify --quiet "origin/${PROMOTION_BRANCH}" >/dev/null; then
            echo "::notice::No ${PROMOTION_BRANCH} to repair."
            exit 0
          fi

          head_tree=$(git rev-parse "origin/${PROMOTION_BRANCH}^{tree}")
          main_tree=$(git rev-parse "origin/main^{tree}")
          if [ "${head_tree}" = "${main_tree}" ]; then
            echo "::notice::${PROMOTION_BRANCH} already matches main."
            exit 0
          fi

          commit=$(git commit-tree "${main_tree}" -p origin/stable -m "chore: promote main to stable")
          git push --force origin "${commit}:refs/heads/${PROMOTION_BRANCH}"
          echo "Rebuilt ${PROMOTION_BRANCH} from main's tree."

  # The reusable declares no workflow-level outputs, so the promotion PR is
  # found by its deterministic head/base pair: reusable-promote-squash derives
  # auto/promote-<source>-to-<target> from the branch-model inputs. A no-op run,
  # where main and stable already match, has no PR at all. Two jobs need the
  # number — the approver below and the gate — so look it up once.
  locate-promotion-pr:
    name: Locate the promotion PR
    needs: [promote, repair-promotion-branch]
    if: needs.promote.result == 'success' && needs.repair-promotion-branch.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      pr_number: ${{ steps.find.outputs.pr_number }}
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Find the open promotion PR
        id: find
        shell: bash
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list \
            --repo "${{ github.repository }}" \
            --base stable \
            --head "${PROMOTION_BRANCH}" \
            --state open \
            --json number \
            --jq '.[0].number // empty')
          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          if [ -z "${PR_NUMBER}" ]; then
            echo "::notice::No open promotion PR."
          fi

  # GitHub holds every check run it creates for a bot-authored pull request in
  # `action_required` until someone approves it, so the promotion PR's own
  # validation reports nothing until then. Without the approval the checks
  # effectively never run — and GitHub throttles scheduled unblocking workflows
  # to hours — so this job approves them seconds after the branch is pushed. If
  # one is ever missed, approve it from the run's page.
  unblock-promotion-checks:
    name: Unblock the promotion PR's checks
    needs: [locate-promotion-pr]
    if: needs.locate-promotion-pr.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      PROMOTION_BRANCH: auto/promote-main-to-stable
    steps:
      - name: Approve pending runs on the promotion branch
        shell: bash
        run: |
          set -euo pipefail

          # Trust boundary: only runs on the bot-owned promotion branch, from
          # the bot itself. Those branches carry only commits that already
          # passed their own PR checks.
          runs_filter=".workflow_runs[] | select(.head_branch == \"${PROMOTION_BRANCH}\") | select(.actor.login == \"github-actions[bot]\") | .id"

          approved=0
          # Runs for a freshly pushed branch appear a few seconds after the
          # push, so retry briefly instead of reporting nothing to do.
          for attempt in 1 2 3 4 5 6; do
            mapfile -t run_ids < <(
              gh api "repos/${{ github.repository }}/actions/runs?status=action_required&per_page=100" \
                --jq "${runs_filter}"
            )

            if [ "${#run_ids[@]}" -gt 0 ]; then
              for run_id in "${run_ids[@]}"; do
                if gh api -X POST "repos/${{ github.repository }}/actions/runs/${run_id}/approve" >/dev/null; then
                  echo "Approved run ${run_id}"
                  approved=$((approved + 1))
                else
                  echo "::warning::Could not approve run ${run_id}"
                fi
              done
              break
            fi

            if [ "${attempt}" -lt 6 ]; then
              sleep 15
            fi
          done

          if [ "${approved}" -eq 0 ]; then
            echo "::notice::No pending runs matched; approve any missed run from its page in the Actions tab."
          fi

  # The reusable's own release gate sits behind `enqueue_promotion`, which is off
  # because a personal repository cannot enroll a promotion for merge. That input
  # is a master switch for both the gate and the enrollment job, so turning
  # enrollment off turned the gate off too. Run the same gate here, so the
  # promotion PR is still verified and labelled before a human merges it.
  gate:
    name: Release gate checks
    needs: [locate-promotion-pr]
    if: needs.locate-promotion-pr.outputs.pr_number != ''
    permissions:
      actions: read
      contents: read
      issues: write
      packages: read
      pull-requests: write
    uses: projectbluefin/actions/.github/workflows/reusable-release-gate.yml@ab62f2774eb465d912b61b5c0cd9cd230c811768 # v1
    with:
      repo: ${{ github.repository }}
      pr_number: ${{ needs.locate-promotion-pr.outputs.pr_number }}
      registry: ghcr.io/${{ github.repository_owner }}
      variants: >-
        [{"image":"${{ github.event.repository.name }}"}]
      cosign_identity_regexp: >-
        ^https://github\.com/${{ github.repository }}/\.github/workflows/
      target_tag: testing
      # head_sha and the e2e_* inputs are deliberately omitted: they feed only
      # the commit-bound E2E check, which run_e2e: false disables. Add them if
      # e2e is ever enabled for this image.
      run_e2e: false
    secrets: inherit

  # The reusable renders a `## Desktop Screenshot` section into every promotion
  # PR body, sourced from `${PRIMARY_IMAGE}-smoke-latest.png` on the testsuite
  # pages site. finpilot does not run an e2e suite (`run_e2e: false` above, and
  # nothing passes `e2e_image` to the reusable), so the smoke image is never
  # produced and the URL 404s. Strip the section here once `gate` has refreshed
  # the gate section, so the cosmetic noise does not survive into the PR an
  # operator reads. Skipped on a no-op run that opened no PR or on a skipped
  # gate (no need to edit before verification). Runs on a *failed* gate as
  # well: a `needs` chain already serialises the jobs, so there is no race,
  # and the operator who triages a failed-gate PR benefits from the same
  # cleanup. Idempotent on re-runs (no edit when the section is already
  # absent).
  #
  # Note: this also drops the merge-policy blockquote the reusable renders
  # inside `## Desktop Screenshot`. finpilot merges by hand rather than via
  # `enqueue_promotion` (a personal fork cannot use a merge queue), so the
  # blockquote advertising auto-merge was wrong anyway; #467 pins
  # `auto_merge: false` in the reusable's input so render-pr-body stops
  # emitting the misleading text for this image.
  strip-screenshot-section:
    name: Drop the broken Desktop Screenshot section
    needs: [locate-promotion-pr, gate]
    if: always() && needs.locate-promotion-pr.outputs.pr_number != '' && needs.gate.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.locate-promotion-pr.outputs.pr_number }}
    steps:
      - name: Strip the Desktop Screenshot section from the promotion PR body
        shell: bash
        run: |
          set -euo pipefail

          # Read the body the reusable rendered. gh's body field is a JSON
          # string, so jq unwraps it to a file the next step can edit.
          orig_body="$(mktemp)"
          stripped_body="$(mktemp)"
          trap 'rm -f "${orig_body}" "${stripped_body}"' EXIT

          gh pr view "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --json body \
            --jq '.body' > "${orig_body}"

          # GitHub normalises PR bodies edited through the web UI to CRLF.
          # The reusable re-renders with LF on every run, so the section
          # heading normally matches; bodies edited by hand would not.
          # Strip the carriage returns so the heading match below works
          # regardless of how the body was last edited (#466 review).
          tr -d '\r' < "${orig_body}" > "${orig_body}.lf"
          mv "${orig_body}.lf" "${orig_body}"

          # The section is emitted by render-pr-body/action.yml as a single
          # `## Desktop Screenshot` heading followed by a CAUTION/IMPORTANT
          # blockquote and a markdown image. The 404 image is what makes
          # the section useless to operators; the blockquote carries the
          # merge-policy note ("merged by a human" / "do not auto-merge")
          # that #467 makes correct upstream, so keep it (#466 review).
          if ! grep -q '^## Desktop Screenshot$' "${orig_body}"; then
            echo "::notice::PR #${PR_NUMBER} has no Desktop Screenshot section; nothing to strip."
            exit 0
          fi

          # Drop the heading line and the markdown image reference emitted by
          # render-pr-body, then trim trailing blank lines so the body does
          # not end with stray whitespace. The blockquote between them is
          # preserved so the merge-policy note ("merged by a human" /
          # "do not auto-merge") stays -- once #467 lands upstream, that
          # note becomes the correct operator-facing text. A `cmp -s`
          # "no-op guard" would be dead code: the early grep short-circuits
          # when the section is absent, and the awk below always emits a
          # body shorter than the input when it is present.
          awk '
            /^## Desktop Screenshot$/ { skip_section = 1; next }
            /^!\[.*\]\(.*\)$/ && skip_section { skip_section = 0; next }
            { lines[NR] = $0; total = NR }
            END {
              last = total
              while (last > 0 && lines[last] == "") last--
              for (i = 1; i <= last; i++) print lines[i]
            }
          ' "${orig_body}" > "${stripped_body}"

          gh pr edit "${PR_NUMBER}" \
            --repo "${{ github.repository }}" \
            --body-file "${stripped_body}"
          echo "Stripped the Desktop Screenshot section from PR #${PR_NUMBER}."
