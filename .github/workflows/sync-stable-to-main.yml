---
name: Sync stable to main

# After each squash-merge promotion (main → stable), the squash commit exists
# only on stable. Since the trees are identical this workflow normally no-ops.
# If stable and main ever diverge (for example a hotfix landed on stable
# directly, or a promotion PR carried an extra commit), this workflow fails
# closed: main is protected and must never be force-reset. Resolve the
# divergence by opening a merge-back pull request into main.

on:
  push:
    branches:
      - stable
  # Normally a no-op. Dispatch it to force the sync after repairing the branch
  # model by hand.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-stable-to-main
  cancel-in-progress: false

jobs:
  sync:
    name: Keep main up-to-date with stable
    uses: projectbluefin/actions/.github/workflows/reusable-sync-branches.yml@38cebd91cf786404252fa184414a51b689d53aa3 # v1
    permissions:
      contents: write
    with:
      source_branch: stable
      target_branch: main
