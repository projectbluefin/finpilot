---
name: PR Image Build

# Build the image on pull requests that change what goes into it, so a broken
# build fails before it merges instead of on the next push to main (#672; the
# break fixed by #671 reached main this way).
#
# Read-only: it never pushes or signs, uses a read-only token and no secrets,
# so it is safe on fork pull requests. The job always runs and finishes in
# seconds when no build input changed, so it can be made a required check
# without a paths filter on the trigger (a filtered-out required check would
# block merges instead of skipping).
on:
  pull_request:
    branches:
      - main
  merge_group:

permissions:
  contents: read

env:
  IMAGE_NAME: "${{ github.event.repository.name }}"
  IMAGE_VENDOR: "${{ github.repository_owner }}"
  # Local tag only; nothing is pushed.
  DEFAULT_TAG: "ci"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: PR image build
    # Pinned to 24.04: projectbluefin/actions' setup-runner hard-asserts
    # `ubuntu-24.04` when adding its resolute apt source (see build-image.yml).
    runs-on: ubuntu-24.04
    # One build with a cold cache fits well inside this; main's cached build
    # takes about 25 minutes.
    timeout-minutes: 150
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Build inputs: the Containerfile, the Justfile that drives the build
      # and the package scan, the build/ and custom/ trees the Containerfile
      # copies, .dockerignore (it shapes the build context), this workflow
      # itself, and build-image.yml (its package scan is checked here, #686).
      - name: Decide whether to build
        id: decide
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MERGE_GROUP_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "merge_group" ]]; then
            base="${MERGE_GROUP_BASE}"
          else
            # A pull_request run checks out GitHub's merge commit; its first
            # parent is the base it was merged onto, so this diff is exactly
            # the pull request's own change.
            base="$(git rev-parse HEAD^1)"
          fi
          build=0
          while IFS= read -r f; do
            case "${f}" in
              Containerfile | Justfile | .dockerignore | build/* | custom/* | .github/workflows/pr-build.yml | .github/workflows/build-image.yml)
                echo "Build input changed: ${f}"
                build=1
                ;;
            esac
          done < <(git diff --name-only "${base}" HEAD)
          echo "build=${build}" >> "${GITHUB_OUTPUT}"
          if [[ "${build}" == "0" ]]; then
            echo "No build inputs changed; skipping the image build." | tee -a "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Prepare environment
        if: steps.decide.outputs.build == '1'
        run: |
          echo "IMAGE_NAME=${IMAGE_NAME,,}" >> "${GITHUB_ENV}"
          echo "IMAGE_VENDOR=${IMAGE_VENDOR,,}" >> "${GITHUB_ENV}"

      - name: Setup runner
        if: steps.decide.outputs.build == '1'
        uses: projectbluefin/actions/bootc-build/setup-runner@d1f65645c53d413462117fe1f05d00b9d9382f89 # v1
        with:
          storage-backend: btrfs
          native-overlay: "true"
          update-podman: "true"
          install-tools: '["just"]'

      - name: Restore DNF cache
        if: steps.decide.outputs.build == '1'
        uses: projectbluefin/actions/bootc-build/dnf-cache@d1f65645c53d413462117fe1f05d00b9d9382f89 # v1
        with:
          action: restore
          cache-name: ${{ env.IMAGE_NAME }}
          cache-bust: ${{ hashFiles('**/Containerfile') }}

      # A single attempt: a real break should report red after one build, not
      # three. Re-run the job by hand for a suspected flake.
      - name: Build image
        if: steps.decide.outputs.build == '1'
        timeout-minutes: 120
        run: |
          sudo -E "$(command -v just)" build "${IMAGE_NAME}" "${DEFAULT_TAG}"

      - name: Report built image
        if: steps.decide.outputs.build == '1'
        run: |
          sudo podman image exists "localhost/${IMAGE_NAME}:${DEFAULT_TAG}"
          echo "Built localhost/${IMAGE_NAME}:${DEFAULT_TAG} (not pushed)." | tee -a "${GITHUB_STEP_SUMMARY}"

      # Run the same package scan main's build runs (the Justfile's `sbom`
      # recipe), but here a failure fails the check. On main the scan is
      # non-blocking so it never stops an image from publishing, which is how
      # #681's broken scan merged with every check green (#686). Nothing is
      # uploaded: this job stays read-only.
      - name: Install Syft
        if: steps.decide.outputs.build == '1'
        id: setup-syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: v1.44.0

      - name: Scan the built image
        if: steps.decide.outputs.build == '1'
        shell: bash
        env:
          SYFT_CMD: ${{ steps.setup-syft.outputs.cmd }}
        run: |
          set -euo pipefail
          mkdir -p sbom-current
          SYFT="${SYFT_CMD}" sudo -E "$(command -v just)" sbom \
            "${IMAGE_NAME}" "${DEFAULT_TAG}" sbom-current
          sbom="sbom-current/${IMAGE_NAME}.sbom.json"
          count="$(jq '.packages | length' "${sbom}")"
          echo "Package scan: ${count} packages in ${sbom}." | tee -a "${GITHUB_STEP_SUMMARY}"
          # A Fedora Atomic image has well over 1,000 packages; a handful means
          # the scan read the wrong thing.
          if (( count < 500 )); then
            echo "::error::The package scan found only ${count} packages (expected at least 500)."
            exit 1
          fi
