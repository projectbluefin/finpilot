name: Validate Renovate Config

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"
      - ".github/workflows/validate-renovate.yml"

permissions:
  {}

jobs:
  validate:
    name: Validate Renovate config
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-validate-renovate.yml@46001bf923f11eab3a88fe1cf4540debb050516c # v1
