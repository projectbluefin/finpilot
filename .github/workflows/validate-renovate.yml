name: Validate Renovate Config

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"
      - ".github/workflows/validate-renovate.yml"

permissions:
  {}

jobs:
  validate:
    name: Validate Renovate config
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-validate-renovate.yml@75348afb3a34c6006a3d3da51e51c9a3818b2616 # v1
