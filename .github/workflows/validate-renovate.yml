name: Validate Renovate Config

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"
      - ".github/workflows/validate-renovate.yml"

permissions:
  {}

jobs:
  validate:
    name: Validate Renovate config
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-validate-renovate.yml@66e378ec91547d283fa077dec1282540b85256d2 # v1
