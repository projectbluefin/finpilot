name: Validate Renovate Config

on:
  pull_request:
  merge_group:
  push:
    branches:
      - main
    paths:
      - ".github/renovate.json"
      - ".github/workflows/renovate.yml"
      - ".github/workflows/validate-renovate.yml"

permissions:
  {}

jobs:
  validate:
    name: Validate Renovate config
    permissions:
      contents: read
    uses: projectbluefin/actions/.github/workflows/reusable-validate-renovate.yml@3ab43283cb0ec8bc62aa18208ccc4978a0fd4c44 # v1
