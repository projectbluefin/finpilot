name: Unit Tests

on:
  pull_request:
    branches: [main, stable]
    # Run unless the change is documentation-only. The suite reads Containerfile,
    # Justfile, build/, custom/ and .github/, so enumerating subjects here is a
    # second copy of that list that silently stops running the tests when a
    # subject is missed. Ignoring only docs keeps the trigger truthful.
    paths-ignore:
      - "**.md"
  push:
    branches: [main, stable]
    paths-ignore:
      - "**.md"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  bats:
    name: BATS unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install just
        env:
          # renovate: datasource=github-releases depName=casey/just
          JUST_VERSION: "1.58.0"
        run: |
          set -euo pipefail
          base="https://github.com/casey/just/releases/download/${JUST_VERSION}"
          asset="just-${JUST_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -sSfL -o "${asset}" "${base}/${asset}"
          curl -sSfL -o SHA256SUMS "${base}/SHA256SUMS"
          grep -F "${asset}" SHA256SUMS | sha256sum -c -
          tar xzf "${asset}" -C /tmp just
          sudo install -m 0755 /tmp/just /usr/local/bin/just
          just --version
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run unit tests
        # `just test-unit` is the single definition of how the suite runs.
        run: just test-unit
