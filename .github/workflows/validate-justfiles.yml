name: Validate Justfiles
permissions:
  contents: read

on:
  pull_request:
    paths:
      - "**/*.just"
      - "Justfile"
      - ".github/workflows/validate-justfiles.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      # `just check` is the single definition of this contract: it covers the
      # root Justfile and every .just file, so the workflow cannot drift from
      # what a contributor runs locally.
      - name: Validate Justfiles
        shell: bash
        run: just check
