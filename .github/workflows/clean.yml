name: Cleanup Old Images
on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete-older-than-90:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve package name
        id: package
        shell: bash
        run: |
          # Derive the cleanup target from the repository name (lowercased),
          # exactly as build-image.yml derives the publish target — so a
          # renamed fork cleans the package it actually pushes (see #291).
          name="${{ github.event.repository.name }}"
          echo "name=${name,,}" >> "${GITHUB_OUTPUT}"

      - name: Cleanup old images
        uses: projectbluefin/actions/bootc-build/ghcr-cleanup@d0d12d2577eb5a629b411ba86973f971bc0639a3 # v1
        with:
          packages: ${{ steps.package.outputs.protean }}
          older-than: 90 days
          keep-n-tagged: 7
          keep-n-untagged: 7
          github-token: ${{ secrets.GITHUB_TOKEN }}
