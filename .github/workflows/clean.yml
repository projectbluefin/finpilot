name: Cleanup Old Images
on:
  schedule:
    - cron: "0 0 * * 0" # Weekly on Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}

jobs:
  delete-older-than-90:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve package name
        id: package
        shell: bash
        run: |
          # Derive the cleanup target from the repository name (lowercased),
          # exactly as build-image.yml derives the publish target, so a renamed
          # fork cleans the package it actually pushes.
          name="${{ github.event.repository.name }}"
          echo "name=${name,,}" >> "${GITHUB_OUTPUT}"

      - name: Cleanup old images
        uses: projectbluefin/actions/bootc-build/ghcr-cleanup@4fb323625b017f6731a9a54c29ec08314f4e9e66 # v1
        with:
          packages: ${{ steps.package.outputs.name }}
          older-than: 90 days
          keep-n-tagged: 7
          keep-n-untagged: 7
          github-token: ${{ secrets.GITHUB_TOKEN }}
