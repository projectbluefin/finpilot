# Interactive install. bootc-image-builder injects clearpart --all,
# autopart --nohome and reboot --eject when there is no kickstart table, which
# erases the first disk without asking, so the table below must stay.
# Nothing here sets a disk layout, locale, user or timezone value: Anaconda asks.
# The image reference is not here either; the Justfile reads it from the image's
# image-info.json.

[customizations.installer.kickstart]
contents = """
# Interactive install. bootc-image-builder supplies the ostreecontainer payload
# line and the bootc origin; everything else is chosen in Anaconda's interface.
"""

[customizations.installer.modules]
# Only entries that differ from bootc-image-builder's own defaults.
enable = [
  "org.fedoraproject.Anaconda.Modules.Timezone",
]
# A community image has no subscription to manage.
disable = ["org.fedoraproject.Anaconda.Modules.Subscription"]
