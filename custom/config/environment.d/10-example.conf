# Example per-user configuration, shipped inert.
#
# Files under custom/config/ land in a new user's ~/.config/, so this one
# arrives at ~/.config/environment.d/10-example.conf.
#
# environment.d is read by systemd's user manager at login, and every KEY=VALUE
# line becomes part of that user's environment. Uncomment a line to try it, or
# delete this file and add configuration for whatever else your image ships.
#
# EDITOR=vim
# PAGER=less
